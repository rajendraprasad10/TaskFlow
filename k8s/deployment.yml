apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-taskflow
  labels:
    app: cicd-taskflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cicd-taskflow
  template:
    metadata:
      labels:
        app: cicd-taskflow
    spec:
      containers:
        - name: cicd-taskflow
          image: 928341811849.dkr.ecr.ap-south-1.amazonaws.com/cicd-taskflow:1.0.10
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
